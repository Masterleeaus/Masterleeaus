<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Jason Lee engineering portfolio</title><desc id="desc">A restrained portfolio banner for Jason Lee showing evidence, evaluation, authority boundaries, and selected engineering systems without claiming ownership of upstream projects.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#163b4d"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><circle cx="1060" cy="35" r="220" fill="#5eead4" opacity=".10"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="64" y="62" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="3">JASON LEE � AI SYSTEMS � EVALUATION � AUTHORITY BOUNDARIES</text><text x="64" y="126" fill="#f8fafc" font-size="52" font-weight="800">Evidence before execution</text><text x="64" y="158" fill="#ccfbf1" font-size="16">A portfolio map of bounded systems, measured tests, and reviewable handoffs</text></g><g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><path d="M135 240H1065" stroke="url(#line)" stroke-width="3"/><g fill="#123348" stroke="#5eead4" stroke-width="2"><circle cx="155" cy="240" r="25"/><circle cx="385" cy="240" r="25"/><circle cx="615" cy="240" r="25"/><circle cx="845" cy="240" r="25"/><circle cx="1065" cy="240" r="25"/></g><g fill="#f8fafc" font-size="12" font-weight="700"><text x="155" y="245">EVIDENCE</text><text x="385" y="245">EVALUATE</text><text x="615" y="245">REVIEW</text><text x="845" y="245">AUTHORIZE</text><text x="1065" y="245">EXECUTE</text></g><g fill="#a7f3d0" font-size="11"><text x="155" y="284">sources + limits</text><text x="385" y="284">fixed cases</text><text x="615" y="284">human boundary</text><text x="845" y="284">capability gate</text><text x="1065" y="284">scoped action</text></g></g></svg>

