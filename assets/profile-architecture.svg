<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Jason Lee engineering portfolio map</title><desc id="desc">Portfolio map linking measured test evidence and review boundaries to DecisionEngine, Interaction Engine, TrustEngine, Titan Zero Field Service Workforce, Climate Crew, and ForgeMesh, with project provenance kept separate from engineering themes.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#163b4d"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6z" fill="#99f6e4"/></marker></defs><rect width="1200" height="480" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="52" y="52" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="3">PORTFOLIO EVIDENCE MAP � PROJECT PROVENANCE REMAINS EXPLICIT</text><text x="52" y="91" fill="#f8fafc" font-size="26" font-weight="800">Measured systems, distinct scopes, one review discipline</text><g stroke="#5eead4" stroke-width="2" fill="#123348"><rect x="55" y="165" width="210" height="100" rx="14"/><rect x="330" y="165" width="220" height="100" rx="14"/><rect x="615" y="165" width="220" height="100" rx="14"/><rect x="900" y="165" width="245" height="100" rx="14"/></g><g stroke="#99f6e4" stroke-width="3" marker-end="url(#a)"><path d="M265 215H323"/><path d="M550 215H608"/><path d="M835 215H893"/></g><g fill="#f8fafc" text-anchor="middle"><text x="160" y="200" font-size="15" font-weight="700">Evidence</text><text x="160" y="226" font-size="12" fill="#a7f3d0">bounded CI + local cases</text><text x="440" y="200" font-size="15" font-weight="700">Evaluation</text><text x="440" y="226" font-size="12" fill="#a7f3d0">DecisionEngine � TrustEngine</text><text x="725" y="200" font-size="15" font-weight="700">Policy</text><text x="725" y="226" font-size="12" fill="#a7f3d0">Interaction � authority handoff</text><text x="1022" y="200" font-size="15" font-weight="700">Operations</text><text x="1022" y="226" font-size="12" fill="#a7f3d0">Workforce � Climate Crew � ForgeMesh</text></g><rect x="150" y="335" width="900" height="72" rx="13" fill="#1d3349" stroke="#60a5fa"/><text x="600" y="363" fill="#dbeafe" text-anchor="middle" font-size="14" font-weight="700">ENGINEERING THEME: REVIEWABLE, SCOPED, EVIDENCE-AWARE SYSTEMS</text><text x="600" y="388" fill="#bfdbfe" text-anchor="middle" font-size="12">The portfolio does not imply upstream authorship for attributed repositories.</text></g></svg>

